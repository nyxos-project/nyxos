# The installer image for a release, built by CI from the release's tag: the ISO (in
# parts under 2 GiB, GitHub's limit for a release file), SHA256SUMS for the ISO and its
# parts, SHA256SUMS.sig (an SSH signature with the release key, when the repository has
# it as the NYXOS_RELEASE_KEY secret; verify with `ssh-keygen -Y verify -f release-signers
# -I nyxos-release -n file -s SHA256SUMS.sig < SHA256SUMS`), and a GitHub build provenance
# attestation tying the ISO to this workflow and commit (`gh attestation verify`).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and attach to
        required: true

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            http2 = false
            stalled-download-timeout = 60

      # Read-only: a release builds from what main and stable already put in the cache.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_NAME }}
          skipPush: true

      - name: Build the installer image
        run: |
          nix build -L .#iso
          mkdir out
          iso=$(find -L result/iso -name '*.iso' | head -1)
          name="nyxos-${TAG#v}-x86_64.iso"
          cp "$iso" "out/$name"
          echo "ISO=out/$name" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ISO }}

      - name: Split, checksum and sign
        env:
          RELEASE_KEY: ${{ secrets.NYXOS_RELEASE_KEY }}
        run: |
          cd out
          name=$(basename "$ISO")
          split -b 1900M -d -a 2 "$name" "$name.part"
          sha256sum "$name" "$name".part* > SHA256SUMS
          if [ -n "$RELEASE_KEY" ]; then
            install -m 600 /dev/null key
            printf '%s\n' "$RELEASE_KEY" > key
            ssh-keygen -Y sign -f key -n file SHA256SUMS
            rm -f key
          fi
          printf 'Join the parts, then check the result:\n\n    cat %s.part* > %s\n    sha256sum -c --ignore-missing SHA256SUMS\n' "$name" "$name" > README.txt

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          gh release upload "$TAG" ./*.part* SHA256SUMS README.txt $(ls SHA256SUMS.sig 2>/dev/null) --clobber
