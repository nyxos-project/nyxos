name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
  workflow_dispatch:

# A commit on main or stable is a candidate for known-good: each gets its own run, which
# a later push doesn't cancel. On other branches a push replaces the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ contains(fromJSON('["refs/heads/main", "refs/heads/stable"]'), github.ref) && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Everything is evaluated in one job, then the checks (the development VM system, an
# installed machine, the catalog, each tool) are built in parallel shards: built one
# after another they no longer fit a job's time.
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # An HTTP/2 framing error from the binary cache once stalled a run for an
          # hour; HTTP/1.1 and a short stall timeout make Nix retry instead.
          extra_nix_config: |
            http2 = false
            stalled-download-timeout = 60

      - name: Format
        run: nix fmt -- --check $(git ls-files '*.nix')

      # Instantiating every check and package (not `nix flake check --no-build`, which
      # can't read the example machine's overrides folder without copying it first).
      - name: Evaluate every check and package
        run: |
          nix eval --json .#checks.x86_64-linux --apply 'builtins.mapAttrs (_: c: c.drvPath)' > /dev/null
          nix eval --json .#packages.x86_64-linux --apply 'builtins.mapAttrs (_: p: p.drvPath)' > /dev/null

      # Round-robin, so the two NixOS systems land in different shards.
      - id: shards
        run: |
          nix eval --json .#checks.x86_64-linux --apply builtins.attrNames |
            jq -c '[range(4) as $i | [to_entries[] | select(.key % 4 == $i) | .value]] | map(select(length > 0))' |
            sed 's/^/shards=/' >> "$GITHUB_OUTPUT"

  build:
    needs: evaluate
    runs-on: ubuntu-latest
    # A hung build otherwise holds the runner for GitHub's six-hour default; a first
    # build of a NixOS system with nothing cached takes a few hours.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.evaluate.outputs.shards) }}
    steps:
      # A full NixOS closure plus the Rust builds doesn't fit the runner's default
      # free space.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            http2 = false
            stalled-download-timeout = 60

      # A tool update's new binaries reach the cache once it's reviewed and merged, not
      # from its pull request; its build runs a new upstream binary, so it doesn't get
      # the cache's token at all.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ !startsWith(github.head_ref || github.ref_name, 'tool-update/') && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ startsWith(github.head_ref || github.ref_name, 'tool-update/') }}

      - name: Build ${{ join(matrix.shard, ', ') }}
        env:
          SHARD: ${{ toJSON(matrix.shard) }}
        run: |
          mapfile -t checks < <(jq -r '.[] | ".#checks.x86_64-linux.\(.)"' <<<"$SHARD")
          nix build -L --no-link --keep-going "${checks[@]}"

  # The one check branch protection asks for (the build jobs are named by their shards):
  # every check evaluated and built.
  ci:
    needs: [evaluate, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluated and built
        run: test "${{ needs.evaluate.result }}" = success && test "${{ needs.build.result }}" = success
