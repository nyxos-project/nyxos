name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung test otherwise holds the runner for GitHub's six-hour default.
    timeout-minutes: 90
    steps:
      # A full NixOS closure plus the Rust builds doesn't fit the runner's default
      # free space.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # An HTTP/2 framing error from the binary cache once stalled a run for an
          # hour; HTTP/1.1 and a short stall timeout make Nix retry instead.
          extra_nix_config: |
            http2 = false
            stalled-download-timeout = 60

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Format
        run: nix fmt -- --check $(git ls-files '*.nix')

      - name: Build the development VM system
        run: nix flake check -L
