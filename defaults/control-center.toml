# Nyx Control Center's NyxOS defaults (/etc/nyxos/defaults/control-center.toml): the
# reference desktop's layout, with Nyx Connect's Devices (fluxd ships with NyxOS). A tile
# whose service isn't there (Tailscale, a VPN, a keyboard light) isn't drawn.
schema = 1
remember_page = true
version = 3

[[pages]]
tiles = [
  { widget = "wifi", size = "2x1" },
  { widget = "bluetooth", size = "2x1" },
  { widget = "vpn", size = "2x1" },
  { widget = "tailscale", size = "2x1" },
  { widget = "dnd", size = "1x1" },
  { widget = "mode", size = "1x1" },
  { widget = "night-light", size = "1x1" },
  { widget = "keep-awake", size = "1x1" },
  { widget = "sound", size = "4x2" },
  { widget = "media", size = "4x2" },
  { widget = "power", size = "2x1" },
  { widget = "battery", size = "2x1" },
  { widget = "devices", size = "1x1" },
  { widget = "microphone", size = "1x1" },
  { widget = "keyboard-light", size = "1x1" },
  { widget = "capture", size = "1x1" },
]

[[pages]]
tiles = [
  { widget = "upcoming", size = "4x3" },
]
